<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Landing Simples</title>
</head>

<body>

    
    <div id="carouselSimples" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://i.pinimg.com/1200x/37/d3/eb/37d3ebbbd5876fdf0dccfc633d8f7f29.jpg" class="d-block w-100" alt="Imagem 1">
            </div>

            <div class="carousel-item">
                <img src="https://i.pinimg.com/736x/58/56/81/585681c6dce12f9a8b6c674a69303655.jpg" class="d-block w-100" alt="Imagem 2">
            </div>

            <div class="carousel-item">
                <img src="https://i.pinimg.com/736x/a3/b0/2f/a3b02ffd75e32bd84e3fa90ebd8a2358.jpg" class="d-block w-100" alt="Imagem 3">
            </div>

        </div>

        
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselSimples" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselSimples" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 - Minha Landing Page</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
